<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Display 2 Viewer (Web Edition)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0d0d12;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #181822;
      border-bottom: 1px solid #282838;
      z-index: 10;
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: #2563eb; }
    .badge {
      font-size: 12px;
      color: #94a3b8;
    }
    .viewer-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #09090c;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button id="btn" onclick="startCapture()">Select Display 2</button>
    <button onclick="toggleFullscreen()">Fullscreen (F11)</button>
    <span class="badge" id="status">Click "Select Display 2" and choose Screen 2.</span>
  </div>
  <div class="viewer-area">
    <video id="screen" autoplay muted playsinline></video>
  </div>
  <script>
    async function startCapture() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            frameRate: { ideal: 60, max: 60 },
            cursor: "always"
          },
          audio: false
        });
        const video = document.getElementById('screen');
        video.srcObject = stream;
        document.getElementById('status').innerText = 'Streaming Display 2 @ 60 FPS';
        document.getElementById('btn').innerText = 'Change Display';
      } catch (err) {
        document.getElementById('status').innerText = 'Selection cancelled or permission denied.';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
    });
  </script>
</body>
</html>
